<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0f">
<title>Gold Tap</title>
<style>
  :root{
    --bg-deep:#0a0a0f;
    --panel:#14141c;
    --panel-2:#191924;
    --gold:#ffd54a;
    --gold-soft:#ffe9a8;
    --gold-deep:#a87c07;
    --text:#f5f5f7;
    --muted:#8b8b9a;
    --line:rgba(255,213,74,.14);
    --radius:16px;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{ height:100%; }

  body{
    margin:0;
    min-height:100vh;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color:var(--text);
    background:
      radial-gradient(circle at 50% -10%, #221f38 0%, rgba(10,10,15,0) 55%),
      radial-gradient(circle at 50% 110%, #1a1526 0%, rgba(10,10,15,0) 50%),
      var(--bg-deep);
    display:flex;
    justify-content:center;
    overflow-x:hidden;
    user-select:none;
    -webkit-user-select:none;
  }

  /* ---------- Layout ---------- */
  .app{
    width:100%;
    max-width:460px;
    min-height:100vh;
    padding:20px 18px 36px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }

  /* ---------- HUD ---------- */
  .hud{ display:flex; flex-direction:column; gap:10px; }

  .card{
    background:linear-gradient(180deg, var(--panel-2), var(--panel));
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 16px;
    box-shadow:0 8px 26px rgba(0,0,0,.45);
  }

  .balance-card{ text-align:center; }

  .label{
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--muted);
    font-weight:700;
  }

  .balance-value{
    margin-top:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    font-size:42px;
    font-weight:900;
    line-height:1;
    color:var(--gold);
    text-shadow:0 0 26px rgba(255,213,74,.35);
    font-variant-numeric:tabular-nums;
  }

  .balance-dot{
    width:22px; height:22px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff6c4, #ffd54a 40%, #c9962a 100%);
    box-shadow:0 0 14px rgba(255,213,74,.7), inset 0 -2px 4px rgba(0,0,0,.35);
    flex:none;
  }

  .energy-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:9px;
  }

  .energy-value{
    font-size:14px;
    font-weight:800;
    color:var(--gold-soft);
    font-variant-numeric:tabular-nums;
  }

  .bar{
    height:10px;
    border-radius:999px;
    background:#08080d;
    border:1px solid rgba(255,255,255,.05);
    overflow:hidden;
  }

  .bar-fill{
    height:100%;
    width:100%;
    border-radius:999px;
    background:linear-gradient(90deg,#f0b90b,#ffe27a);
    box-shadow:0 0 12px rgba(255,213,74,.55);
    transition:width .3s ease, background .3s ease, box-shadow .3s ease;
  }

  .bar-fill.low{
    background:linear-gradient(90deg,#ff4d4d,#ff9a3d);
    box-shadow:0 0 12px rgba(255,77,77,.55);
  }

  /* ---------- Coin ---------- */
  .coin-stage{
    flex:1;
    min-height:290px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    padding:14px 0;
  }

  .coin-glow{
    position:absolute;
    width:300px; height:300px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,213,74,.30) 0%, rgba(255,213,74,0) 65%);
    filter:blur(6px);
    animation:glowPulse 3.2s ease-in-out infinite;
    pointer-events:none;
  }

  @keyframes glowPulse{
    0%,100%{ transform:scale(.88); opacity:.65; }
    50%    { transform:scale(1.12); opacity:1; }
  }

  .coin{
    position:relative;
    z-index:1;
    width:220px; height:220px;
    border:none;
    border-radius:50%;
    padding:0;
    cursor:pointer;
    touch-action:manipulation;
    font-family:inherit;
    background:radial-gradient(circle at 34% 28%, #fff8cf 0%, #ffd54a 32%, #e3ab1c 64%, #8a6410 100%);
    box-shadow:
      0 0 60px rgba(255,213,74,.35),
      0 18px 40px rgba(0,0,0,.55),
      inset 0 -12px 22px rgba(90,60,0,.45),
      inset 0 10px 20px rgba(255,255,255,.55);
    transition:transform .09s ease, box-shadow .25s ease;
  }

  .coin:active{ transform:scale(.94); }

  .coin.pop{ animation:coinPop .2s ease; }

  @keyframes coinPop{
    0%  { transform:scale(.92); }
    55% { transform:scale(1.05); }
    100%{ transform:scale(1); }
  }

  .coin.empty{
    filter:saturate(.35) brightness(.7);
    box-shadow:0 0 26px rgba(255,213,74,.12), 0 14px 30px rgba(0,0,0,.55);
  }

  .coin-inner{
    width:77%; height:77%;
    margin:0 auto;
    border-radius:50%;
    border:3px solid rgba(120,84,10,.45);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:
      inset 0 0 26px rgba(255,255,255,.4),
      inset 0 -6px 14px rgba(120,84,10,.25);
  }

  .coin-label{
    font-size:26px;
    font-weight:900;
    letter-spacing:.14em;
    color:#7a5709;
    text-shadow:0 1px 0 rgba(255,255,255,.55);
  }

  .shake{ animation:shake .4s ease; }

  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    18%{ transform:translateX(-9px); }
    38%{ transform:translateX(9px); }
    58%{ transform:translateX(-6px); }
    78%{ transform:translateX(6px); }
  }

  /* ---------- Buttons ---------- */
  .btn{
    font-family:inherit;
    border:none;
    border-radius:14px;
    padding:15px 18px;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
    transition:transform .08s ease, box-shadow .15s ease, opacity .2s ease;
  }

  .btn-gold{
    width:100%;
    color:#3a2a00;
    background:linear-gradient(180deg,#ffe27a,#f0b90b);
    box-shadow:0 5px 0 var(--gold-deep), 0 12px 26px rgba(240,185,11,.22);
  }

  .btn-gold:active{
    transform:translateY(3px);
    box-shadow:0 2px 0 var(--gold-deep), 0 6px 14px rgba(240,185,11,.2);
  }

  .btn-gold:disabled{
    opacity:.5;
    cursor:not-allowed;
    transform:none;
    box-shadow:0 5px 0 #5c4405;
  }

  .btn-small{
    padding:10px 16px;
    font-size:13px;
    border-radius:11px;
    flex:none;
  }

  .btn-outline{
    color:var(--gold);
    background:rgba(255,213,74,.08);
    border:1px solid rgba(255,213,74,.35);
  }

  .btn-outline:active{ transform:scale(.96); }

  .btn-outline:disabled{
    color:var(--muted);
    background:rgba(255,255,255,.03);
    border-color:rgba(255,255,255,.08);
    cursor:default;
  }

  /* ---------- Tasks ---------- */
  .tasks{ display:flex; flex-direction:column; gap:10px; }

  .section-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 4px;
  }

  .section-head h2{
    margin:0;
    font-size:14px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--muted);
    font-weight:800;
  }

  .badge{
    font-size:11px;
    font-weight:800;
    color:#3a2a00;
    background:linear-gradient(180deg,#ffe27a,#f0b90b);
    padding:4px 10px;
    border-radius:999px;
  }

  .badge.done{
    color:var(--muted);
    background:rgba(255,255,255,.06);
  }

  .task-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 14px;
    background:linear-gradient(180deg, var(--panel-2), var(--panel));
    border:1px solid rgba(255,255,255,.06);
    border-radius:var(--radius);
    transition:border-color .25s ease, opacity .25s ease;
  }

  .task-row.completed{ border-color:rgba(80,220,140,.28); }

  .task-icon{
    width:40px; height:40px;
    flex:none;
    display:grid;
    place-items:center;
    font-size:19px;
    border-radius:12px;
    background:rgba(255,213,74,.09);
    border:1px solid rgba(255,213,74,.16);
  }

  .task-info{ flex:1; min-width:0; }

  .task-title{
    font-size:14px;
    font-weight:700;
    margin-bottom:3px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .task-reward{
    font-size:12px;
    font-weight:700;
    color:var(--gold);
    display:flex;
    align-items:center;
    gap:6px;
  }

  .task-row.completed .task-reward{ color:#5ee08f; }

  /* ---------- Floating "+1" ---------- */
  #fx{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:60;
  }

  .floaty{
    position:fixed;
    font-size:28px;
    font-weight:900;
    color:var(--gold);
    text-shadow:0 0 16px rgba(255,213,74,.9), 0 2px 6px rgba(0,0,0,.8);
    transform:translate(-50%,-50%);
    animation:floatUp .95s cubic-bezier(.2,.7,.4,1) forwards;
    will-change:transform,opacity;
  }

  @keyframes floatUp{
    0%  { opacity:1; transform:translate(-50%,-50%) scale(.6); }
    25% { opacity:1; transform:translate(-50%,-80%) scale(1.15); }
    100%{ opacity:0; transform:translate(-50%,-215%) scale(.95); }
  }

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;
    left:50%;
    bottom:26px;
    transform:translate(-50%,18px);
    max-width:88vw;
    padding:12px 20px;
    border-radius:13px;
    background:rgba(24,24,34,.96);
    border:1px solid rgba(255,213,74,.3);
    color:var(--gold-soft);
    font-size:14px;
    font-weight:700;
    text-align:center;
    box-shadow:0 12px 34px rgba(0,0,0,.6);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:90;
  }

  .toast.show{ opacity:1; transform:translate(-50%,0); }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:22px;
    background:rgba(5,5,9,.78);
    backdrop-filter:blur(4px);
    -webkit-backdrop-filter:blur(4px);
  }

  .overlay[hidden]{ display:none; }

  .modal{
    width:100%;
    max-width:340px;
    padding:24px 22px 22px;
    border-radius:20px;
    text-align:center;
    background:linear-gradient(180deg,#1c1c28,#12121a);
    border:1px solid rgba(255,213,74,.22);
    box-shadow:0 24px 60px rgba(0,0,0,.7);
    animation:modalIn .22s ease;
  }

  @keyframes modalIn{
    from{ opacity:0; transform:translateY(14px) scale(.96); }
    to  { opacity:1; transform:translateY(0) scale(1); }
  }

  .modal-tag{
    display:inline-block;
    font-size:10px;
    font-weight:900;
    letter-spacing:.18em;
    color:#3a2a00;
    background:linear-gradient(180deg,#ffe27a,#f0b90b);
    padding:4px 11px;
    border-radius:999px;
    margin-bottom:14px;
  }

  .modal-title{
    font-size:19px;
    font-weight:900;
    margin:0 0 8px;
  }

  .modal-body{
    font-size:14px;
    color:var(--muted);
    line-height:1.5;
    margin:0 0 20px;
    min-height:40px;
  }

  .modal-body strong{ color:var(--gold); }

  .spinner{
    width:34px; height:34px;
    margin:2px auto 14px;
    border-radius:50%;
    border:3px solid rgba(255,213,74,.18);
    border-top-color:var(--gold);
    animation:spin .8s linear infinite;
  }

  @keyframes spin{ to{ transform:rotate(360deg); } }

  .spinner.hidden{ display:none; }

  @media (max-height:640px){
    .coin{ width:180px; height:180px; }
    .coin-label{ font-size:21px; }
    .coin-stage{ min-height:230px; }
    .balance-value{ font-size:34px; }
  }
</style>
</head>
<body>

<div class="app">

  <!-- ============ HUD ============ -->
  <header class="hud">
    <div class="card balance-card">
      <div class="label">Balance</div>
      <div class="balance-value">
        <span class="balance-dot"></span>
        <span id="balance">0</span>
      </div>
    </div>

    <div class="card">
      <div class="energy-head">
        <span class="label">⚡ Energy</span>
        <span class="energy-value" id="energyText">100 / 100</span>
      </div>
      <div class="bar">
        <div class="bar-fill" id="energyBar"></div>
      </div>
    </div>
  </header>

  <!-- ============ COIN ============ -->
  <main class="coin-stage">
    <div class="coin-glow"></div>
    <button class="coin" id="coin" aria-label="Tap the coin to earn points">
      <span class="coin-inner">
        <span class="coin-label">TAP</span>
      </span>
    </button>
  </main>

  <!-- ============ AD BUTTON ============ -->
  <button class="btn btn-gold" id="adBtn" onclick="showRewardedAd()">
    🎬 Watch Ad for Energy
  </button>

  <!-- ============ TASKS ============ -->
  <section class="tasks">
    <div class="section-head">
      <h2>Tasks</h2>
      <span class="badge" id="taskBadge">1 available</span>
    </div>

    <div class="task-row" id="subTaskRow">
      <div class="task-icon" id="subTaskIcon">📣</div>
      <div class="task-info">
        <div class="task-title">Subscribe to our channel</div>
        <div class="task-reward" id="subTaskReward">+500 Points</div>
      </div>
      <button class="btn btn-small btn-outline" id="subBtn">Start</button>
    </div>
  </section>

</div>

<!-- floating +1 layer -->
<div id="fx"></div>

<!-- toast -->
<div class="toast" id="toast"></div>

<!-- rewarded-ad modal -->
<div class="overlay" id="overlay" hidden>
  <div class="modal">
    <div class="modal-tag">SPONSORED</div>
    <h3 class="modal-title">Rewarded Ad</h3>
    <div class="spinner" id="adSpinner"></div>
    <p class="modal-body" id="modalBody">Simulated ad playing…</p>
    <button class="btn btn-gold" id="modalClose" hidden>Claim &amp; Close</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* =========================================================
     CONFIG
     ========================================================= */
  const MAX_ENERGY   = 100;   // energy cap
  const TAP_COST     = 1;     // energy spent per tap
  const TAP_REWARD   = 1;     // points earned per tap
  const AD_ENERGY    = 25;    // energy granted per rewarded ad
  const AD_SECONDS   = 3;     // simulated ad length
  const SUB_REWARD   = 500;   // points for the channel task
  const REGEN_MS     = 1000;  // 1 energy per second

  /* =========================================================
     STATE
     ========================================================= */
  const state = {
    balance: 0,
    energy: MAX_ENERGY,
    adRunning: false,
    subDone: false
  };

  /* =========================================================
     DOM
     ========================================================= */
  const $ = (id) => document.getElementById(id);

  const balanceEl   = $('balance');
  const energyText  = $('energyText');
  const energyBar   = $('energyBar');
  const coin        = $('coin');
  const adBtn       = $('adBtn');
  const fxLayer     = $('fx');
  const toastEl     = $('toast');
  const overlay     = $('overlay');
  const modalBody   = $('modalBody');
  const modalClose  = $('modalClose');
  const adSpinner   = $('adSpinner');
  const subBtn      = $('subBtn');
  const subTaskRow  = $('subTaskRow');
  const subTaskIcon = $('subTaskIcon');
  const subTaskReward = $('subTaskReward');
  const taskBadge   = $('taskBadge');

  /* =========================================================
     RENDERING
     ========================================================= */
  function updateUI() {
    balanceEl.textContent = state.balance.toLocaleString('en-US');

    energyText.textContent = state.energy + ' / ' + MAX_ENERGY;

    const pct = (state.energy / MAX_ENERGY) * 100;
    energyBar.style.width = pct + '%';
    energyBar.classList.toggle('low', pct <= 25);

    coin.classList.toggle('empty', state.energy <= 0);
    coin.setAttribute('aria-disabled', state.energy <= 0 ? 'true' : 'false');
  }

  /* =========================================================
     TOAST
     ========================================================= */
  let toastTimer = null;
  function toast(message) {
    toastEl.textContent = message;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2100);
  }

  /* =========================================================
     FLOATING "+1"
     ========================================================= */
  function spawnFloaty(x, y, text) {
    const el = document.createElement('div');
    el.className = 'floaty';
    el.textContent = text;
    el.style.left = (x + (Math.random() * 26 - 13)) + 'px';
    el.style.top  = y + 'px';
    fxLayer.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }

  /* =========================================================
     TAPPING
     ========================================================= */
  function handleTap(event) {
    if (state.energy < TAP_COST) {
      coin.classList.remove('shake');
      void coin.offsetWidth;           // restart animation
      coin.classList.add('shake');
      toast('⚡ Out of energy — watch an ad or wait!');
      return;
    }

    state.energy  -= TAP_COST;
    state.balance += TAP_REWARD;
    updateUI();

    coin.classList.remove('pop');
    void coin.offsetWidth;
    coin.classList.add('pop');

    spawnFloaty(event.clientX, event.clientY, '+' + TAP_REWARD);

    if (navigator.vibrate) {
      try { navigator.vibrate(8); } catch (e) { /* ignore */ }
    }
  }

  coin.addEventListener('pointerdown', handleTap);
  coin.addEventListener('contextmenu', (e) => e.preventDefault());

  /* =========================================================
     ENERGY REGENERATION — 1 per second
     ========================================================= */
  setInterval(function () {
    if (state.energy < MAX_ENERGY) {
      state.energy = Math.min(MAX_ENERGY, state.energy + 1);
      updateUI();
    }
  }, REGEN_MS);

  /* =========================================================
     REWARDED AD — PLACEHOLDER
     ---------------------------------------------------------
     Replace the body of this function with your real ad SDK:

        showRewardedAd() {
          MyAdSDK.showRewarded()
            .then((rewarded) => { if (rewarded) grantEnergy(25); })
            .catch(() => toast('Ad not available'));
        }
     ========================================================= */
  function showRewardedAd() {
    if (state.adRunning) return;

    console.log('[placeholder] showRewardedAd() called — no real ad SDK wired up.');

    if (state.energy >= MAX_ENERGY) {
      toast('⚡ Energy is already full!');
      return;
    }

    state.adRunning = true;
    adBtn.disabled = true;

    overlay.hidden = false;
    modalClose.hidden = true;
    adSpinner.classList.remove('hidden');

    let secondsLeft = AD_SECONDS;
    modalBody.textContent = 'Simulated ad playing… ' + secondsLeft + 's';

    const timer = setInterval(function () {
      secondsLeft -= 1;

      if (secondsLeft > 0) {
        modalBody.textContent = 'Simulated ad playing… ' + secondsLeft + 's';
        return;
      }

      clearInterval(timer);
      adSpinner.classList.add('hidden');

      // --- grant the reward ---
      const before = state.energy;
      state.energy = Math.min(MAX_ENERGY, state.energy + AD_ENERGY);
      const gained = state.energy - before;
      updateUI();

      modalBody.innerHTML =
        'Reward granted: <strong>+' + gained + ' ⚡</strong>' +
        (gained < AD_ENERGY ? '<br><small>(energy capped at ' + MAX_ENERGY + ')</small>' : '');

      modalClose.hidden = false;
      modalClose.focus();
    }, 1000);
  }

  // expose globally so the inline onclick="showRewardedAd()" works
  window.showRewardedAd = showRewardedAd;

  function closeAdModal() {
    overlay.hidden = true;
    state.adRunning = false;
    adBtn.disabled = false;
    adSpinner.classList.remove('hidden');
  }

  modalClose.addEventListener('click', closeAdModal);
  overlay.addEventListener('click', function (e) {
    if (e.target === overlay && !modalClose.hidden) closeAdModal();
  });

  /* =========================================================
     TASKS
     ========================================================= */
  subBtn.addEventListener('click', function () {
    if (state.subDone) return;

    // In a real app you would open your channel here and then verify
    // the subscription server-side before granting the reward.
    // e.g. window.open('https://t.me/your_channel', '_blank');

    subBtn.disabled = true;
    subBtn.textContent = 'Checking…';

    setTimeout(function () {
      state.subDone = true;
      state.balance += SUB_REWARD;
      updateUI();

      subTaskRow.classList.add('completed');
      subTaskIcon.textContent = '✅';
      subTaskReward.textContent = 'Completed';
      subBtn.textContent = 'Done';
      subBtn.classList.remove('btn-outline');

      taskBadge.textContent = 'All done';
      taskBadge.classList.add('done');

      toast('✅ Task complete! +' + SUB_REWARD + ' points');

      const rect = subTaskRow.getBoundingClientRect();
      spawnFloaty(rect.left + rect.width / 2, rect.top + rect.height / 2, '+' + SUB_REWARD);
    }, 900);
  });

  /* =========================================================
     BOOT
     ========================================================= */
  updateUI();
})();
</script>
</body>
</html>
